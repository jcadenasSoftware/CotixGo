# CotixGo Android — propiedades de build.
# JDK aprobado para builds: JDK 21 LTS (decisión D16).
# El daemon de Gradle debe ejecutarse con JDK 21: configurar JAVA_HOME apuntando
# al JDK 21 instalado, o descomentar y ajustar org.gradle.java.home en la máquina
# local (la ruta es específica de cada equipo y por eso no se fija aquí).
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

openapi: 3.0.3
info:
  title: CotixGo API
  description: >-
    API REST del backend CotixGo (PHP + MySQL, Hostinger). v1.0 implementada en
    F3 para desarrollo local (php -S + MariaDB/MySQL local). Solo datos
    sintéticos: HTTPS, despliegue real y proveedor de correo siguen pendientes.
  version: 1.0.0
servers:
  - url: https://api.cotixgo.example
    description: Producción (Hostinger) — URL real pendiente.
  - url: http://localhost:8080
    description: Desarrollo local (php -S, con -c backend/dev.ini).

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: cotixgo-api }

  /auth/register:
    post:
      summary: Registro de cuenta (email + contraseña)
      description: >-
        Crea la cuenta canónica del servidor. Acepta `local_user_id` para
        vincular la instalación: si el UUID está libre se adopta como
        `user_id` canónico; si está ocupado se devuelve un UUID nuevo.
        Email ya registrado → `ACCOUNT_EXISTS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                local_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Cuenta creada y sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /auth/login:
    post:
      summary: Inicio de sesión (email + contraseña)
      description: >-
        Devuelve el `user_id` canónico y un token de sesión. En una
        instalación limpia el cliente usa la identidad devuelta y ejecuta
        `GET /sync/pull` desde cursor 0 para restaurar los datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/recover:
    post:
      summary: Recuperación de acceso (aprobada por correo)
      description: >-
        Mecanismo local de prueba en F3: registra el mensaje de recuperación
        en la tabla `mail_outbox` del servidor. **No envía correo real** — el
        proveedor queda pendiente. **El flujo está incompleto por diseño en
        F3**: el token generado no es consumido por ningún endpoint de
        restablecimiento; definir esa ruta queda pendiente junto al proveedor
        real. Devuelve siempre 200 para no revelar si el correo existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Solicitud registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /sync/push:
    post:
      summary: Envío de operaciones offline
      description: >-
        Lote de operaciones del dispositivo, ordenadas por dependencia
        (maestras → documentos → versiones). Cada operación se procesa en su
        propia transacción y devuelve resultado individual — el lote no es
        atómico. Idempotencia por `operation_id` + payload inmutable;
        concurrencia por `entity_id` + `base_server_version`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, operations]
              properties:
                device_id: { type: string, format: uuid }
                operations:
                  type: array
                  items: { $ref: '#/components/schemas/SyncOperation' }
      responses:
        '200':
          description: Resultado por operación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/pull:
    get:
      summary: Descarga incremental de cambios
      description: >-
        Devuelve entidades del usuario con `server_seq` mayor que `cursor`,
        ordenadas por `server_seq`, más el nuevo cursor. Con `cursor=0`
        devuelve todo (restauración en instalación limpia).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Cambios desde el cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AuthSession:
      type: object
      required: [user_id, token, expires_at]
      properties:
        user_id: { type: string, format: uuid }
        token: { type: string }
        expires_at: { type: string, format: date-time }
    SyncOperation:
      type: object
      required: [operation_id, entity_type, entity_id, type, payload]
      properties:
        operation_id:
          type: string
          format: uuid
          description: UUID único por operación; clave de idempotencia.
        entity_type:
          type: string
          enum: [user, profile, client, service, retention_config, quote, quote_version,
                 job, job_quote, job_activity, job_material,
                 report, report_job, report_version,
                 collection_account, collection_method, payment, payment_assignment,
                 consolidated_collection, payment_adjustment, payment_refund,
                 material, purchase, inventory_movement, inventory_stock]
        entity_id:
          type: string
          format: uuid
          description: UUID estable de la entidad (provisional→oficial conserva el mismo id).
        type:
          type: string
          enum: [upsert, resolve]
          description: >-
            `upsert` crea/actualiza/archiva/transita vía snapshot completo de
            entidad; `resolve` registra la resolución de un conflicto.
        base_server_version:
          type: integer
          description: Versión de servidor que el cliente vio por última vez (0 = nunca sincronizada).
        supersedes:
          type: string
          format: uuid
          description: operation_id de la operación pausada que esta corrige/resuelve.
        payload:
          type: object
          description: Snapshot inmutable de la entidad (camelCase, campos Room).
    SyncOperationResult:
      type: object
      required: [operation_id, status]
      properties:
        operation_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        status:
          type: string
          enum: [APPLIED, REJECTED, CONFLICT]
        code: { type: string, description: Motivo (INVALID_TRANSITION, DEPENDENCY, FORBIDDEN_ENTITY, etc.) }
        message: { type: string }
        official_number:
          type: string
          description: Número oficial asignado cuando aplica (TIPO-AAAAMM-NNN).
          example: COT-202610-023
        server_version: { type: integer }
        server_state:
          type: object
          description: Copia vigente en el servidor cuando hay CONFLICT (preservada para resolución del usuario).
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncOperationResult' }
    SyncChange:
      type: object
      required: [entity_type, entity_id, server_version, server_seq, payload]
      properties:
        entity_type: { type: string }
        entity_id: { type: string }
        server_version: { type: integer }
        server_seq: { type: integer, description: Cursor/orden del servidor; no es identidad de negocio. }
        server_order:
          type: integer
          description: Orden autoritativo de versión de Cotización (solo quote_version), fuera del snapshot.
        official_number: { type: string, nullable: true }
        has_version_conflict: { type: boolean }
        payload: { type: object }
    SyncPullResponse:
      type: object
      required: [changes, next_cursor]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/SyncChange' }
        next_cursor: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
  responses:
    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Entrada inválida o incompleta.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConflictError:
      description: Conflicto de recurso (p. ej. cuenta ya registrada).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
